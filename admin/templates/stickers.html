<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стикеры — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="bi bi-robot"></i> BINTY Admin</span>
            <div class="d-flex align-items-center">
                <span class="text-white-50 me-3" id="currentTime"></span>
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                        <li class="nav-item"><a class="nav-link" href="/users"><i class="bi bi-people"></i> Пользователи</a></li>
                        <li class="nav-item"><a class="nav-link" href="/memes"><i class="bi bi-emoji-laughing"></i> Мемы</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/stickers"><i class="bi bi-sticky"></i> Стикеры</a></li>
                        <li class="nav-item"><a class="nav-link" href="/quests"><i class="bi bi-list-check"></i> Квесты</a></li>
                        <li class="nav-item"><a class="nav-link" href="/signals"><i class="bi bi-broadcast"></i> Сигналы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/fumble"><i class="bi bi-dice-5"></i> Вопросы фамбла</a></li>
                        <li class="nav-item"><a class="nav-link" href="/achievements"><i class="bi bi-trophy"></i> Достижения</a></li>
                        <li class="nav-item"><a class="nav-link" href="/subscribers"><i class="bi bi-envelope"></i> Подписчики</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-exclamation-triangle"></i> Логи ошибок</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto">
                <h2 class="page-title"><i class="bi bi-sticky me-2"></i>Управление стикерами</h2>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header"><i class="bi bi-plus-circle me-2"></i>Добавить стикер</div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label"><i class="bi bi-file-text me-1"></i>File ID</label>
                                    <input type="text" id="stickerFileId" class="form-control" placeholder="CAACAgIAAxkB...">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label"><i class="bi bi-folder me-1"></i>Пак</label>
                                    <select id="stickerPack" class="form-select">
                                        <option value="regular">Regular</option>
                                        <option value="gif">GIF</option>
                                    </select>
                                </div>
                                <button class="btn btn-primary w-100" onclick="addSticker()"><i class="bi bi-plus-lg"></i> Добавить</button>
                            </div>
                        </div>
                    </div>
                </div>

                <ul class="nav nav-tabs mb-3">
                    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#regular"><i class="bi bi-file-image me-1"></i>Regular</a></li>
                    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#gif"><i class="bi bi-file-gif me-1"></i>GIF</a></li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="regular">
                        <div class="card">
                            <div class="card-body">
                                <div class="row" id="regularStickers"></div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="gif">
                        <div class="card">
                            <div class="card-body">
                                <div class="row" id="gifStickers"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('ru-RU');
        }
        updateTime();
        setInterval(updateTime, 1000);

        document.addEventListener('DOMContentLoaded', loadStickers);

        async function loadStickers() {
            const res = await fetch('/api/stickers');
            const stickers = await res.json();
            
            const regular = stickers.filter(s => s.pack === 'regular');
            const gif = stickers.filter(s => s.pack === 'gif');
            
            document.getElementById('regularStickers').innerHTML = renderStickerGrid(regular, 'regular');
            document.getElementById('gifStickers').innerHTML = renderStickerGrid(gif, 'gif');
        }

        function renderStickerGrid(stickers, pack) {
            if (stickers.length === 0) {
                return `<div class="col-12 text-center py-4 text-muted"><i class="bi bi-emoji-frown fs-1"></i><p class="mt-2">Нет стикеров в этом паке</p></div>`;
            }
            
            return stickers.map(s => `
                <div class="col-md-3 col-sm-6 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <code class="d-block mb-2 text-truncate" style="font-size: 11px;">${s.file_id}</code>
                            <button class="btn btn-sm btn-outline-danger w-100" onclick="deleteSticker(${s.id})"><i class="bi bi-trash"></i> Удалить</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function addSticker() {
            const file_id = document.getElementById('stickerFileId').value.trim();
            const pack = document.getElementById('stickerPack').value;
            
            if (!file_id) return alert('Введите File ID');
            
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Добавление...';
            
            await fetch('/api/stickers', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({file_id, pack})
            });
            
            document.getElementById('stickerFileId').value = '';
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-plus-lg"></i> Добавить';
            loadStickers();
        }

        async function deleteSticker(id) {
            if (!confirm('Удалить стикер?')) return;
            await fetch(`/api/stickers/${id}`, {method: 'DELETE'});
            loadStickers();
        }
    </script>
</body>
</html>
