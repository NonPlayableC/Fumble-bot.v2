<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переводы — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="bi bi-robot"></i> BINTY Admin</span>
            <div class="d-flex align-items-center">
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                        <li class="nav-item"><a class="nav-link" href="/users"><i class="bi bi-people"></i> Пользователи</a></li>
                        <li class="nav-item"><a class="nav-link" href="/memes"><i class="bi bi-emoji-laughing"></i> Мемы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/stickers"><i class="bi bi-sticky"></i> Стикеры</a></li>
                        <li class="nav-item"><a class="nav-link" href="/quests"><i class="bi bi-list-check"></i> Квесты</a></li>
                        <li class="nav-item"><a class="nav-link" href="/signals"><i class="bi bi-broadcast"></i> Сигналы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/fumble"><i class="bi bi-dice-5"></i> Вопросы фамбла</a></li>
                        <li class="nav-item"><a class="nav-link" href="/achievements"><i class="bi bi-trophy"></i> Достижения</a></li>
                        <li class="nav-item"><a class="nav-link" href="/subscribers"><i class="bi bi-envelope"></i> Подписчики</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/translations"><i class="bi bi-translate"></i> Переводы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-exclamation-triangle"></i> Логи ошибок</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="page-title"><i class="bi bi-translate me-2"></i>Управление переводами</h2>
                    <select id="langSelect" class="form-select w-auto">
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="zh">中文</option>
                    </select>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <input type="text" id="searchInput" class="form-control" placeholder="Поиск по ключу...">
                    </div>
                </div>

                <div class="card fade-in">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Ключ</th>
                                        <th>Значение</th>
                                        <th style="width: 100px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="translationsTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Редактировать перевод</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editLang">
                    <input type="hidden" id="editKey">
                    <div class="mb-3">
                        <label class="form-label">Ключ</label>
                        <input type="text" id="displayKey" class="form-control" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Значение</label>
                        <textarea id="editValue" class="form-control" rows="5"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="saveTranslation()"><i class="bi bi-check-lg"></i> Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let editModal;
        let translations = [];

        document.addEventListener('DOMContentLoaded', () => {
            editModal = new bootstrap.Modal(document.getElementById('editModal'));
            loadTranslations();
            
            document.getElementById('langSelect').addEventListener('change', loadTranslations);
            document.getElementById('searchInput').addEventListener('input', filterTable);
        });

        async function loadTranslations() {
            const lang = document.getElementById('langSelect').value;
            const res = await fetch(`/api/translations?lang=${lang}`);
            translations = await res.json();
            renderTable(translations);
        }

        function renderTable(data) {
            const tbody = document.getElementById('translationsTable');
            tbody.innerHTML = data.map(t => `
                <tr data-key="${t.key}">
                    <td><code>${t.key}</code></td>
                    <td><small>${escapeHtml(t.value).substring(0, 100)}${t.value.length > 100 ? '…' : ''}</small></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick='openEdit("${t.lang}", "${t.key}", ${JSON.stringify(t.value).replace(/'/g, "&apos;")})'><i class="bi bi-pencil"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function filterTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = translations.filter(t => t.key.toLowerCase().includes(search));
            renderTable(filtered);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openEdit(lang, key, value) {
            document.getElementById('editLang').value = lang;
            document.getElementById('editKey').value = key;
            document.getElementById('displayKey').value = key;
            document.getElementById('editValue').value = value;
            editModal.show();
        }

        async function saveTranslation() {
            const lang = document.getElementById('editLang').value;
            const key = document.getElementById('editKey').value;
            const value = document.getElementById('editValue').value;
            
            await fetch('/api/translations', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({lang, key, value})
            });
            
            editModal.hide();
            loadTranslations();
        }
    </script>
</body>
</html>
