<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переводы — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- ====== ШАПКА (ТАКАЯ ЖЕ КАК ВЕЗДЕ) ====== -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="bi bi-robot"></i> BINTY Admin</span>
            <div class="d-flex align-items-center">
                <span class="text-white-50 me-3" id="currentTime"></span>
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <!-- ====== БОКОВОЕ МЕНЮ (ТАКОЕ ЖЕ КАК ВЕЗДЕ) ====== -->
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                        <li class="nav-item"><a class="nav-link" href="/users"><i class="bi bi-people"></i> Пользователи</a></li>
                        <li class="nav-item"><a class="nav-link" href="/memes"><i class="bi bi-emoji-laughing"></i> Мемы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/stickers"><i class="bi bi-sticky"></i> Стикеры</a></li>
                        <li class="nav-item"><a class="nav-link" href="/quests"><i class="bi bi-list-check"></i> Квесты</a></li>
                        <li class="nav-item"><a class="nav-link" href="/signals"><i class="bi bi-broadcast"></i> Сигналы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/fumble"><i class="bi bi-dice-5"></i> Вопросы фамбла</a></li>
                        <li class="nav-item"><a class="nav-link" href="/achievements"><i class="bi bi-trophy"></i> Достижения</a></li>
                        <li class="nav-item"><a class="nav-link" href="/subscribers"><i class="bi bi-envelope"></i> Подписчики</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-exclamation-triangle"></i> Логи ошибок</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/translations"><i class="bi bi-translate"></i> Переводы</a></li>
                    </ul>
                </div>
            </nav>

            <!-- ====== ОСНОВНОЙ КОНТЕНТ ====== -->
            <main class="col-md-10 ms-sm-auto">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="page-title"><i class="bi bi-translate me-2"></i>Управление переводами</h2>
                    <button class="btn btn-primary" onclick="openNewModal()"><i class="bi bi-plus-lg"></i> Новый ключ</button>
                </div>

                <div class="mb-3">
                    <select id="langSelect" class="form-select w-auto d-inline-block">
                        <option value="ru">🇷🇺 Русский</option>
                        <option value="en">🇬🇧 English</option>
                        <option value="es">🇪🇸 Español</option>
                        <option value="zh">🇨🇳 中文</option>
                    </select>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Ключ</th>
                                <th>Значение</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="translationsTable"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- ====== МОДАЛЬНОЕ ОКНО ====== -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Добавить ключ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editLang">
                    <input type="hidden" id="editOldKey">
                    <div class="mb-3">
                        <label class="form-label">Ключ</label>
                        <input type="text" id="editKey" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Значение</label>
                        <textarea id="editValue" class="form-control" rows="3" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="saveTranslation()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let editModal;
        let currentLang = 'ru';

        // Обновление времени в шапке
        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('ru-RU');
        }
        updateTime();
        setInterval(updateTime, 1000);

        document.addEventListener('DOMContentLoaded', () => {
            editModal = new bootstrap.Modal(document.getElementById('editModal'));
            loadTranslations();
            document.getElementById('langSelect').addEventListener('change', (e) => {
                currentLang = e.target.value;
                loadTranslations();
            });
        });

        async function loadTranslations() {
            const res = await fetch(`/api/translations?lang=${currentLang}`);
            const translations = await res.json();
            const tbody = document.getElementById('translationsTable');
            tbody.innerHTML = translations.map(t => `
                <tr>
                    <td><code>${t.key}</code></td>
                    <td>${escapeHtml(t.value)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick='openEditModal("${t.lang}", "${t.key}", ${JSON.stringify(t.value)})'><i class="bi bi-pencil"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function openNewModal() {
            document.getElementById('modalTitle').textContent = 'Добавить ключ';
            document.getElementById('editLang').value = currentLang;
            document.getElementById('editOldKey').value = '';
            document.getElementById('editKey').value = '';
            document.getElementById('editValue').value = '';
            document.getElementById('editKey').disabled = false;
            editModal.show();
        }

        function openEditModal(lang, key, value) {
            document.getElementById('modalTitle').textContent = 'Редактировать ключ';
            document.getElementById('editLang').value = lang;
            document.getElementById('editOldKey').value = key;
            document.getElementById('editKey').value = key;
            document.getElementById('editValue').value = value;
            document.getElementById('editKey').disabled = true; // Ключ менять нельзя
            editModal.show();
        }

        async function saveTranslation() {
            const lang = document.getElementById('editLang').value;
            const oldKey = document.getElementById('editOldKey').value;
            const key = document.getElementById('editKey').value;
            const value = document.getElementById('editValue').value;

            if (!key.trim()) {
                alert('Ключ не может быть пустым');
                return;
            }

            // Если редактировали и случайно изменили ключ - удаляем старый
            if (oldKey && oldKey !== key) {
                await fetch(`/api/translations?lang=${lang}&key=${encodeURIComponent(oldKey)}`, { method: 'DELETE' });
            }

            await fetch('/api/translations', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({lang, key, value})
            });

            editModal.hide();
            loadTranslations();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
