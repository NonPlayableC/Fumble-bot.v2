<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логи ошибок — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎭 BINTY Admin</span>
            <div class="d-flex">
                <a href="/" class="btn btn-outline-light btn-sm me-2">Дашборд</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <h2>📜 Логи ошибок</h2>
        
        <div class="row mb-3">
            <div class="col-md-2">
                <button class="btn btn-outline-danger" onclick="clearLogs()">🗑️ Очистить логи</button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table table-sm table-hover">
                <thead>
                    <tr>
                        <th>Время</th>
                        <th>User ID</th>
                        <th>Тип ошибки</th>
                        <th>Сообщение</th>
                        <th>Детали</th>
                    </tr>
                </thead>
                <tbody id="logsTable"></tbody>
            </table>
        </div>
        
        <nav>
            <ul class="pagination" id="pagination"></ul>
        </nav>
    </div>

    <!-- Модальное окно деталей -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Детали ошибки</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <pre id="detailContent" style="max-height: 500px; overflow: auto; background: #f5f5f5; padding: 10px;"></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let detailModal;
        let currentPage = 1;
        
        document.addEventListener('DOMContentLoaded', () => {
            detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
            loadLogs();
        });
        
        async function loadLogs(page = 1) {
            currentPage = page;
            const res = await fetch(`/api/error-logs?page=${page}&per_page=50`);
            const data = await res.json();
            
            const tbody = document.getElementById('logsTable');
            tbody.innerHTML = data.logs.map(l => `
                <tr>
                    <td>${l.created_at ? l.created_at.substring(0, 19).replace('T', ' ') : '-'}</td>
                    <td>${l.user_id || '-'}</td>
                    <td><span class="badge bg-danger">${l.error_type || '-'}</span></td>
                    <td>${(l.error_message || '').substring(0, 100)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-info" onclick='showDetail(${JSON.stringify(l).replace(/'/g, "&apos;")})'>🔍</button>
                    </td>
                </tr>
            `).join('');
            
            renderPagination(data.total, data.page, data.per_page);
        }
        
        function renderPagination(total, page, perPage) {
            const totalPages = Math.ceil(total / perPage);
            const pagination = document.getElementById('pagination');
            let html = '';
            
            for (let i = 1; i <= totalPages && i <= 10; i++) {
                html += `<li class="page-item ${i === page ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="loadLogs(${i}); return false;">${i}</a>
                </li>`;
            }
            pagination.innerHTML = html;
        }
        
        function showDetail(log) {
            const content = `
Тип: ${log.error_type || '-'}
Сообщение: ${log.error_message || '-'}
User ID: ${log.user_id || '-'}
Время: ${log.created_at || '-'}
Контекст: ${log.context || '-'}

Traceback:
${log.traceback || '-'}
            `;
            document.getElementById('detailContent').textContent = content;
            detailModal.show();
        }
        
        async function clearLogs() {
            if (!confirm('Удалить ВСЕ логи ошибок?')) return;
            await fetch('/api/error-logs', {method: 'DELETE'});
            loadLogs();
        }
    </script>
</body>
</html>
