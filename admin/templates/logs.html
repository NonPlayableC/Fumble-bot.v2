<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логи ошибок — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="bi bi-robot"></i> BINTY Admin</span>
            <div class="d-flex align-items-center">
                <span class="text-white-50 me-3" id="currentTime"></span>
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                        <li class="nav-item"><a class="nav-link" href="/users"><i class="bi bi-people"></i> Пользователи</a></li>
                        <li class="nav-item"><a class="nav-link" href="/memes"><i class="bi bi-emoji-laughing"></i> Мемы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/stickers"><i class="bi bi-sticky"></i> Стикеры</a></li>
                        <li class="nav-item"><a class="nav-link" href="/quests"><i class="bi bi-list-check"></i> Квесты</a></li>
                        <li class="nav-item"><a class="nav-link" href="/signals"><i class="bi bi-broadcast"></i> Сигналы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/fumble"><i class="bi bi-dice-5"></i> Вопросы фамбла</a></li>
                        <li class="nav-item"><a class="nav-link" href="/achievements"><i class="bi bi-trophy"></i> Достижения</a></li>
                        <li class="nav-item"><a class="nav-link" href="/subscribers"><i class="bi bi-envelope"></i> Подписчики</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/logs"><i class="bi bi-exclamation-triangle"></i> Логи ошибок</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="page-title"><i class="bi bi-exclamation-triangle me-2"></i>Логи ошибок</h2>
                    <button class="btn btn-outline-danger" onclick="clearLogs()"><i class="bi bi-trash"></i> Очистить логи</button>
                </div>

                <div class="card fade-in">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th style="width: 160px;">Время</th>
                                        <th style="width: 100px;">User ID</th>
                                        <th style="width: 120px;">Тип</th>
                                        <th>Сообщение</th>
                                        <th style="width: 80px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="logsTable">
                                    <tr><td colspan="5" class="text-center py-4">Загрузка...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <div id="logCountInfo" class="text-muted"></div>
                        <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Модальное окно деталей -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-bug me-2"></i>Детали ошибки</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <pre id="detailContent" class="bg-light p-3 rounded" style="max-height: 500px; overflow: auto; font-size: 13px;"></pre>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let detailModal;
        let currentPage = 1;
        let totalPages = 1;

        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('ru-RU');
        }
        updateTime();
        setInterval(updateTime, 1000);

        document.addEventListener('DOMContentLoaded', () => {
            detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
            loadLogs();
        });

        async function loadLogs(page = 1) {
            currentPage = page;
            const tbody = document.getElementById('logsTable');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></td></tr>';
            
            const res = await fetch(`/api/error-logs?page=${page}&per_page=30`);
            const data = await res.json();
            
            document.getElementById('logCountInfo').textContent = `Всего: ${data.total} | Страница ${data.page} из ${Math.ceil(data.total / data.per_page)}`;
            
            if (data.logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-success"><i class="bi bi-check-circle fs-3"></i><p class="mt-2">Ошибок нет! Всё работает идеально.</p></td></tr>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            
            tbody.innerHTML = data.logs.map(l => {
                const badgeClass = l.error_type?.includes('Conflict') ? 'warning' : 'danger';
                return `<tr>
                    <td><small>${l.created_at ? l.created_at.substring(0, 19).replace('T', ' ') : '-'}</small></td>
                    <td>${l.user_id || '—'}</td>
                    <td><span class="badge badge-${badgeClass}">${l.error_type || '-'}</span></td>
                    <td>${(l.error_message || '').substring(0, 100)}${(l.error_message || '').length > 100 ? '…' : ''}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-info" onclick='showDetail(${JSON.stringify(l).replace(/'/g, "&apos;")})'><i class="bi bi-eye"></i></button>
                    </td>
                </tr>`;
            }).join('');
            
            renderPagination(data.total, data.page, data.per_page);
        }

        function renderPagination(total, page, perPage) {
            totalPages = Math.ceil(total / perPage);
            const pagination = document.getElementById('pagination');
            let html = '';
            
            html += `<li class="page-item ${page === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${page - 1}); return false;"><i class="bi bi-chevron-left"></i></a></li>`;
            
            for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) {
                html += `<li class="page-item ${i === page ? 'active' : ''}"><a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a></li>`;
            }
            
            html += `<li class="page-item ${page === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${page + 1}); return false;"><i class="bi bi-chevron-right"></i></a></li>`;
            
            pagination.innerHTML = html;
        }

        function changePage(page) {
            if (page >= 1 && page <= totalPages) {
                loadLogs(page);
            }
        }

        function showDetail(log) {
            const content = `
Тип ошибки: ${log.error_type || '—'}
Сообщение: ${log.error_message || '—'}
User ID: ${log.user_id || '—'}
Время: ${log.created_at || '—'}

Контекст:
${log.context || '—'}

Traceback:
${log.traceback || '—'}
            `;
            document.getElementById('detailContent').textContent = content;
            detailModal.show();
        }

        async function clearLogs() {
            if (!confirm('Удалить ВСЕ логи ошибок? Это действие необратимо.')) return;
            await fetch('/api/error-logs', {method: 'DELETE'});
            loadLogs();
        }
    </script>
</body>
</html>
