<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопросы фамбла — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="bi bi-robot"></i> BINTY Admin</span>
            <div class="d-flex align-items-center">
                <span class="text-white-50 me-3" id="currentTime"></span>
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                        <li class="nav-item"><a class="nav-link" href="/users"><i class="bi bi-people"></i> Пользователи</a></li>
                        <li class="nav-item"><a class="nav-link" href="/memes"><i class="bi bi-emoji-laughing"></i> Мемы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/stickers"><i class="bi bi-sticky"></i> Стикеры</a></li>
                        <li class="nav-item"><a class="nav-link" href="/quests"><i class="bi bi-list-check"></i> Квесты</a></li>
                        <li class="nav-item"><a class="nav-link" href="/signals"><i class="bi bi-broadcast"></i> Сигналы</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/fumble"><i class="bi bi-dice-5"></i> Вопросы фамбла</a></li>
                        <li class="nav-item"><a class="nav-link" href="/achievements"><i class="bi bi-trophy"></i> Достижения</a></li>
                        <li class="nav-item"><a class="nav-link" href="/subscribers"><i class="bi bi-envelope"></i> Подписчики</a></li>
                        <li class="nav-item"><a class="nav-link" href="/translations"><i class="bi bi-translate"></i> Переводы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-exclamation-triangle"></i> Логи ошибок</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="page-title"><i class="bi bi-dice-5 me-2"></i>Вопросы для ручного фамбла</h2>
                    <button class="btn btn-success" onclick="openQuestionModal(null)"><i class="bi bi-plus-lg"></i> Новый вопрос</button>
                </div>

                <div class="card fade-in">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Вопрос (RU)</th>
                                        <th>Вариантов</th>
                                        <th>Статус</th>
                                        <th>Действия</th>
                                    </tr>
                                </thead>
                                <tbody id="questionsTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Модальное окно вопроса -->
    <div class="modal fade" id="questionModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"><i class="bi bi-plus-circle me-2"></i>Новый вопрос</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="questionId">
                    
                    <ul class="nav nav-tabs mb-3">
                        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#q-ru">RU</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#q-en">EN</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#q-es">ES</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#q-zh">ZH</a></li>
                    </ul>
                    
                    <div class="tab-content mb-3">
                        <div class="tab-pane fade show active" id="q-ru">
                            <textarea id="question_ru" class="form-control" rows="2" placeholder="Вопрос на русском"></textarea>
                        </div>
                        <div class="tab-pane fade" id="q-en">
                            <textarea id="question_en" class="form-control" rows="2" placeholder="Вопрос на английском"></textarea>
                        </div>
                        <div class="tab-pane fade" id="q-es">
                            <textarea id="question_es" class="form-control" rows="2" placeholder="Вопрос на испанском"></textarea>
                        </div>
                        <div class="tab-pane fade" id="q-zh">
                            <textarea id="question_zh" class="form-control" rows="2" placeholder="Вопрос на китайском"></textarea>
                        </div>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input type="checkbox" id="is_active" class="form-check-input" checked>
                        <label class="form-check-label">Активен</label>
                    </div>
                    
                    <hr>
                    <h6><i class="bi bi-list-ul me-1"></i>Варианты ответов</h6>
                    <div id="optionsContainer"></div>
                    <button class="btn btn-sm btn-outline-primary mt-2" onclick="addOption()"><i class="bi bi-plus-lg"></i> Добавить вариант</button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="saveQuestion()"><i class="bi bi-check-lg"></i> Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let questionModal;
        let questions = [];
        let optionIndex = 0;

        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('ru-RU');
        }
        updateTime();
        setInterval(updateTime, 1000);

        document.addEventListener('DOMContentLoaded', () => {
            questionModal = new bootstrap.Modal(document.getElementById('questionModal'));
            loadQuestions();
        });

        async function loadQuestions() {
            const res = await fetch('/api/fumble-questions');
            questions = await res.json();
            
            const tbody = document.getElementById('questionsTable');
            if (questions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Нет вопросов</td></tr>';
                return;
            }
            
            tbody.innerHTML = questions.map(q => `
                <tr>
                    <td>${q.id}</td>
                    <td>${(q.question_ru || q.question_en || '').substring(0, 50)}…</td>
                    <td><span class="badge bg-secondary">${q.options?.length || 0}</span></td>
                    <td>${q.is_active ? '<span class="badge badge-success">Активен</span>' : '<span class="badge badge-danger">Выкл</span>'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openQuestionModal(${q.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteQuestion(${q.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function openQuestionModal(id) {
            const question = id ? questions.find(q => q.id === id) : null;
            document.getElementById('questionId').value = id || '';
            document.getElementById('modalTitle').innerHTML = id ? '<i class="bi bi-pencil-square me-2"></i>Редактировать вопрос' : '<i class="bi bi-plus-circle me-2"></i>Новый вопрос';
            
            document.getElementById('question_ru').value = question?.question_ru || '';
            document.getElementById('question_en').value = question?.question_en || '';
            document.getElementById('question_es').value = question?.question_es || '';
            document.getElementById('question_zh').value = question?.question_zh || '';
            document.getElementById('is_active').checked = question?.is_active ?? true;
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            optionIndex = 0;
            
            if (question?.options) {
                question.options.sort((a, b) => a.sort_order - b.sort_order).forEach(opt => {
                    addOption(opt);
                });
            }
            
            questionModal.show();
        }

        function addOption(existing = null) {
            const idx = optionIndex++;
            const container = document.getElementById('optionsContainer');
            
            const div = document.createElement('div');
            div.className = 'row mb-2 option-row align-items-end';
            div.dataset.index = idx;
            div.dataset.id = existing?.id || '';
            
            div.innerHTML = `
                <div class="col-md-3">
                    <label class="form-label small">RU</label>
                    <input type="text" class="form-control form-control-sm" placeholder="RU" value="${existing?.option_ru || ''}">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">EN</label>
                    <input type="text" class="form-control form-control-sm" placeholder="EN" value="${existing?.option_en || ''}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">ES</label>
                    <input type="text" class="form-control form-control-sm" placeholder="ES" value="${existing?.option_es || ''}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">ZH</label>
                    <input type="text" class="form-control form-control-sm" placeholder="ZH" value="${existing?.option_zh || ''}">
                </div>
                <div class="col-md-1">
                    <label class="form-label small">Вес</label>
                    <select class="form-select form-select-sm">
                        <option value="high" ${existing?.weight === 'high' ? 'selected' : ''}>High</option>
                        <option value="medium" ${existing?.weight === 'medium' ? 'selected' : ''}>Medium</option>
                        <option value="low" ${existing?.weight === 'low' ? 'selected' : ''}>Low</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-sm btn-outline-danger w-100" onclick="this.closest('.option-row').remove()"><i class="bi bi-trash"></i></button>
                </div>
            `;
            
            container.appendChild(div);
        }

        async function saveQuestion() {
            const id = document.getElementById('questionId').value;
            
            const options = [];
            document.querySelectorAll('.option-row').forEach((row, i) => {
                const inputs = row.querySelectorAll('input');
                const select = row.querySelector('select');
                options.push({
                    id: row.dataset.id || null,
                    option_ru: inputs[0].value,
                    option_en: inputs[1].value,
                    option_es: inputs[2].value,
                    option_zh: inputs[3].value,
                    weight: select.value,
                    sort_order: i
                });
            });
            
            const data = {
                question_ru: document.getElementById('question_ru').value,
                question_en: document.getElementById('question_en').value,
                question_es: document.getElementById('question_es').value,
                question_zh: document.getElementById('question_zh').value,
                is_active: document.getElementById('is_active').checked,
                options: options
            };
            
            const url = id ? `/api/fumble-questions/${id}` : '/api/fumble-questions';
            const method = id ? 'PUT' : 'POST';
            
            await fetch(url, {
                method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            questionModal.hide();
            loadQuestions();
        }

        async function deleteQuestion(id) {
            if (!confirm('Удалить вопрос и все варианты?')) return;
            await fetch(`/api/fumble-questions/${id}`, {method: 'DELETE'});
            loadQuestions();
        }
    </script>
</body>
</html>
