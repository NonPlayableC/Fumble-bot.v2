<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мемы — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="bi bi-robot"></i> BINTY Admin</span>
            <div class="d-flex align-items-center">
                <span class="text-white-50 me-3" id="currentTime"></span>
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                        <li class="nav-item"><a class="nav-link" href="/users"><i class="bi bi-people"></i> Пользователи</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/memes"><i class="bi bi-emoji-laughing"></i> Мемы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/stickers"><i class="bi bi-sticky"></i> Стикеры</a></li>
                        <li class="nav-item"><a class="nav-link" href="/quests"><i class="bi bi-list-check"></i> Квесты</a></li>
                        <li class="nav-item"><a class="nav-link" href="/signals"><i class="bi bi-broadcast"></i> Сигналы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/fumble"><i class="bi bi-dice-5"></i> Вопросы фамбла</a></li>
                        <li class="nav-item"><a class="nav-link" href="/achievements"><i class="bi bi-trophy"></i> Достижения</a></li>
                        <li class="nav-item"><a class="nav-link" href="/subscribers"><i class="bi bi-envelope"></i> Подписчики</a></li>
                        <li class="nav-item"><a class="nav-link" href="/translations"><i class="bi bi-translate"></i> Переводы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-exclamation-triangle"></i> Логи ошибок</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto">
                <h2 class="page-title"><i class="bi bi-emoji-laughing me-2"></i>Управление мемами</h2>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header"><i class="bi bi-plus-circle me-2"></i>Добавить мем</div>
                            <div class="card-body">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
                                    <input type="text" id="memeUrl" class="form-control" placeholder="https://i.imgflip.com/...">
                                    <button class="btn btn-primary" onclick="addMeme()"><i class="bi bi-plus-lg"></i> Добавить</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card fade-in">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-images me-2"></i>Галерея мемов</span>
                        <span class="badge bg-secondary" id="memeCount">0</span>
                    </div>
                    <div class="card-body">
                        <div class="row g-4" id="memesGrid">
                            <div class="col-12 text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('ru-RU');
        }
        updateTime();
        setInterval(updateTime, 1000);

        document.addEventListener('DOMContentLoaded', loadMemes);

        async function loadMemes() {
            const res = await fetch('/api/memes');
            const memes = await res.json();
            
            const grid = document.getElementById('memesGrid');
            document.getElementById('memeCount').textContent = memes.length;
            
            if (memes.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center py-5 text-muted"><i class="bi bi-emoji-frown fs-1"></i><p class="mt-2">Нет мемов. Добавь первый!</p></div>';
                return;
            }
            
            grid.innerHTML = memes.map(m => `
                <div class="col-md-3 col-sm-6">
                    <div class="card h-100">
                        <img src="${m.url}" class="card-img-top" style="height: 180px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/300x180?text=Ошибка+загрузки'">
                        <div class="card-body p-3">
                            <button class="btn btn-sm btn-outline-danger w-100" onclick="deleteMeme(${m.id})">
                                <i class="bi bi-trash"></i> Удалить
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function addMeme() {
            const input = document.getElementById('memeUrl');
            const url = input.value.trim();
            if (!url) return alert('Введите URL');
            
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Добавление...';
            
            await fetch('/api/memes', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url})
            });
            
            input.value = '';
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-plus-lg"></i> Добавить';
            loadMemes();
        }

        async function deleteMeme(id) {
            if (!confirm('Удалить мем?')) return;
            await fetch(`/api/memes/${id}`, {method: 'DELETE'});
            loadMemes();
        }
    </script>
</body>
</html>
