<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мемы — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎭 BINTY Admin</span>
            <div class="d-flex">
                <a href="/" class="btn btn-outline-light btn-sm me-2">Дашборд</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <h2>😂 Управление мемами</h2>
        
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Добавить мем</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">URL изображения</label>
                            <input type="text" id="memeUrl" class="form-control" placeholder="https://...">
                        </div>
                        <button class="btn btn-primary" onclick="addMeme()">Добавить</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-8">
                <div class="row" id="memesGrid"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadMemes);
        
        async function loadMemes() {
            const res = await fetch('/api/memes');
            const memes = await res.json();
            
            const grid = document.getElementById('memesGrid');
            grid.innerHTML = memes.map(m => `
                <div class="col-md-3 mb-3">
                    <div class="card">
                        <img src="${m.url}" class="card-img-top" style="height: 150px; object-fit: cover;">
                        <div class="card-body p-2">
                            <button class="btn btn-sm btn-danger w-100" onclick="deleteMeme(${m.id})">Удалить</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        async function addMeme() {
            const url = document.getElementById('memeUrl').value;
            if (!url) return alert('Введите URL');
            
            await fetch('/api/memes', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url})
            });
            
            document.getElementById('memeUrl').value = '';
            loadMemes();
        }
        
        async function deleteMeme(id) {
            if (!confirm('Удалить мем?')) return;
            await fetch(`/api/memes/${id}`, {method: 'DELETE'});
            loadMemes();
        }
    </script>
</body>
</html>
