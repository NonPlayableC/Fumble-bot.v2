<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квесты — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎭 BINTY Admin</span>
            <div class="d-flex">
                <a href="/" class="btn btn-outline-light btn-sm me-2">Дашборд</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        <h2>📋 Управление квестами</h2>
        
        <div class="row mb-3">
            <div class="col-md-8">
                <button class="btn btn-success" onclick="openModal(null)">+ Новый квест</button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название (EN)</th>
                        <th>Тип</th>
                        <th>Цель</th>
                        <th>Награда (очки)</th>
                        <th>Активен</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="questsTable"></tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal fade" id="questModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Новый квест</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="questId">
                    
                    <ul class="nav nav-tabs">
                        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-en">EN</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-ru">RU</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-es">ES</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-zh">ZH</a></li>
                    </ul>
                    
                    <div class="tab-content mt-3">
                        <div class="tab-pane fade show active" id="tab-en">
                            <label class="form-label">Название (EN)</label>
                            <input type="text" id="name_en" class="form-control">
                        </div>
                        <div class="tab-pane fade" id="tab-ru">
                            <label class="form-label">Название (RU)</label>
                            <input type="text" id="name_ru" class="form-control">
                        </div>
                        <div class="tab-pane fade" id="tab-es">
                            <label class="form-label">Название (ES)</label>
                            <input type="text" id="name_es" class="form-control">
                        </div>
                        <div class="tab-pane fade" id="tab-zh">
                            <label class="form-label">Название (ZH)</label>
                            <input type="text" id="name_zh" class="form-control">
                        </div>
                    </div>
                    
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label class="form-label">Тип условия</label>
                            <select id="condition_type" class="form-select">
                                <option value="fumble_count">Количество фамблов</option>
                                <option value="signal_count">Количество сигналов</option>
                                <option value="streak_days">Дней стрика</option>
                                <option value="referral_count">Рефералы</option>
                                <option value="smart_fumble">Умные фамблы</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Значение (цель)</label>
                            <input type="number" id="condition_value" class="form-control">
                        </div>
                    </div>
                    
                    <div class="row mt-3">
                        <div class="col-md-4">
                            <label class="form-label">Награда (очки)</label>
                            <input type="number" id="reward_points" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Награда ($BINTY)</label>
                            <input type="number" id="reward_binty" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Длительность (часов)</label>
                            <input type="number" id="duration_hours" class="form-control" value="24">
                        </div>
                    </div>
                    
                    <div class="form-check mt-3">
                        <input type="checkbox" id="is_active" class="form-check-input" checked>
                        <label class="form-check-label">Активен</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="saveQuest()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let questModal;
        let quests = [];
        
        document.addEventListener('DOMContentLoaded', () => {
            questModal = new bootstrap.Modal(document.getElementById('questModal'));
            loadQuests();
        });
        
        async function loadQuests() {
            const res = await fetch('/api/quests');
            quests = await res.json();
            
            const tbody = document.getElementById('questsTable');
            tbody.innerHTML = quests.map(q => `
                <tr>
                    <td>${q.id}</td>
                    <td>${q.name_en || '-'}</td>
                    <td>${q.condition_type}</td>
                    <td>${q.condition_value}</td>
                    <td>${q.reward_points}</td>
                    <td>${q.is_active ? '✅' : '❌'}</td>
                    <td>
                        <button class="btn btn-sm btn-primary" onclick="openModal(${q.id})">✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteQuest(${q.id})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }
        
        function openModal(id) {
            const quest = id ? quests.find(q => q.id === id) : null;
            document.getElementById('questId').value = id || '';
            document.getElementById('modalTitle').textContent = id ? 'Редактировать квест' : 'Новый квест';
            
            document.getElementById('name_en').value = quest?.name_en || '';
            document.getElementById('name_ru').value = quest?.name_ru || '';
            document.getElementById('name_es').value = quest?.name_es || '';
            document.getElementById('name_zh').value = quest?.name_zh || '';
            document.getElementById('condition_type').value = quest?.condition_type || 'fumble_count';
            document.getElementById('condition_value').value = quest?.condition_value || 1;
            document.getElementById('reward_points').value = quest?.reward_points || 0;
            document.getElementById('reward_binty').value = quest?.reward_binty || 0;
            document.getElementById('duration_hours').value = quest?.duration_hours || 24;
            document.getElementById('is_active').checked = quest?.is_active ?? true;
            
            questModal.show();
        }
        
        async function saveQuest() {
            const id = document.getElementById('questId').value;
            const data = {
                name_en: document.getElementById('name_en').value,
                name_ru: document.getElementById('name_ru').value,
                name_es: document.getElementById('name_es').value,
                name_zh: document.getElementById('name_zh').value,
                condition_type: document.getElementById('condition_type').value,
                condition_value: parseInt(document.getElementById('condition_value').value),
                reward_points: parseInt(document.getElementById('reward_points').value),
                reward_binty: parseInt(document.getElementById('reward_binty').value),
                duration_hours: parseInt(document.getElementById('duration_hours').value),
                is_active: document.getElementById('is_active').checked
            };
            
            const url = id ? `/api/quests/${id}` : '/api/quests';
            const method = id ? 'PUT' : 'POST';
            
            await fetch(url, {
                method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            questModal.hide();
            loadQuests();
        }
        
        async function deleteQuest(id) {
            if (!confirm('Удалить квест?')) return;
            await fetch(`/api/quests/${id}`, {method: 'DELETE'});
            loadQuests();
        }
    </script>
</body>
</html>
