<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Достижения — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="bi bi-robot"></i> BINTY Admin</span>
            <div class="d-flex align-items-center">
                <span class="text-white-50 me-3" id="currentTime"></span>
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                        <li class="nav-item"><a class="nav-link" href="/users"><i class="bi bi-people"></i> Пользователи</a></li>
                        <li class="nav-item"><a class="nav-link" href="/memes"><i class="bi bi-emoji-laughing"></i> Мемы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/stickers"><i class="bi bi-sticky"></i> Стикеры</a></li>
                        <li class="nav-item"><a class="nav-link" href="/quests"><i class="bi bi-list-check"></i> Квесты</a></li>
                        <li class="nav-item"><a class="nav-link" href="/signals"><i class="bi bi-broadcast"></i> Сигналы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/fumble"><i class="bi bi-dice-5"></i> Вопросы фамбла</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/achievements"><i class="bi bi-trophy"></i> Достижения</a></li>
                        <li class="nav-item"><a class="nav-link" href="/subscribers"><i class="bi bi-envelope"></i> Подписчики</a></li>
                         <li class="nav-item"><a class="nav-link" href="/translations"><i class="bi bi-translate"></i> Переводы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-exclamation-triangle"></i> Логи ошибок</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="page-title"><i class="bi bi-trophy me-2"></i>Управление достижениями</h2>
                    <button class="btn btn-success" onclick="openModal(null)"><i class="bi bi-plus-lg"></i> Новое достижение</button>
                </div>

                <div class="card fade-in">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>Ключ</th>
                                        <th>Название (RU)</th>
                                        <th>Категория</th>
                                        <th>Награда</th>
                                        <th>Статус</th>
                                        <th>Действия</th>
                                    </tr>
                                </thead>
                                <tbody id="achievementsTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal fade" id="achievementModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"><i class="bi bi-plus-circle me-2"></i>Новое достижение</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="achievementKey">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Ключ (уникальный)</label>
                            <input type="text" id="key" class="form-control" placeholder="first_fumble">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Иконка</label>
                            <input type="text" id="icon" class="form-control" placeholder="🏅">
                        </div>
                    </div>
                    
                    <ul class="nav nav-tabs mb-3">
                        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#a-ru">RU</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#a-en">EN</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#a-es">ES</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#a-zh">ZH</a></li>
                    </ul>
                    
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="a-ru">
                            <input type="text" id="name_ru" class="form-control mb-2" placeholder="Название (RU)">
                            <textarea id="desc_ru" class="form-control" rows="2" placeholder="Описание (RU)"></textarea>
                        </div>
                        <div class="tab-pane fade" id="a-en">
                            <input type="text" id="name_en" class="form-control mb-2" placeholder="Название (EN)">
                            <textarea id="desc_en" class="form-control" rows="2" placeholder="Описание (EN)"></textarea>
                        </div>
                        <div class="tab-pane fade" id="a-es">
                            <input type="text" id="name_es" class="form-control mb-2" placeholder="Название (ES)">
                            <textarea id="desc_es" class="form-control" rows="2" placeholder="Описание (ES)"></textarea>
                        </div>
                        <div class="tab-pane fade" id="a-zh">
                            <input type="text" id="name_zh" class="form-control mb-2" placeholder="Название (ZH)">
                            <textarea id="desc_zh" class="form-control" rows="2" placeholder="Описание (ZH)"></textarea>
                        </div>
                    </div>
                    
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label class="form-label">Награда (очки)</label>
                            <input type="number" id="reward" class="form-control" value="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Категория</label>
                            <select id="category" class="form-select">
                                <option value="fumble">Фамблы</option>
                                <option value="signal">Сигналы</option>
                                <option value="streak">Стрик</option>
                                <option value="wallet">Кошелёк</option>
                                <option value="social">Социальное</option>
                                <option value="special">Особое</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-check mt-3">
                        <input type="checkbox" id="is_active" class="form-check-input" checked>
                        <label class="form-check-label">Активно</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="saveAchievement()"><i class="bi bi-check-lg"></i> Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let achievementModal;
        let achievements = [];

        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('ru-RU');
        }
        updateTime();
        setInterval(updateTime, 1000);

        document.addEventListener('DOMContentLoaded', () => {
            achievementModal = new bootstrap.Modal(document.getElementById('achievementModal'));
            loadAchievements();
        });

        async function loadAchievements() {
            const res = await fetch('/api/achievements-list');
            achievements = await res.json();
            
            const tbody = document.getElementById('achievementsTable');
            if (achievements.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Нет достижений</td></tr>';
                return;
            }
            
            tbody.innerHTML = achievements.map(a => `
                <tr>
                    <td><code>${a.achievement_key}</code></td>
                    <td>${a.name_ru || a.name_en || '-'}</td>
                    <td><span class="badge bg-info">${a.category || 'fumble'}</span></td>
                    <td><span class="badge bg-warning text-dark">${a.reward_points} pts</span></td>
                    <td>${a.is_active ? '<span class="badge badge-success">Активно</span>' : '<span class="badge badge-danger">Выкл</span>'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openModal('${a.achievement_key}')"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteAchievement('${a.achievement_key}')"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(key) {
            const ach = key ? achievements.find(a => a.achievement_key === key) : null;
            document.getElementById('achievementKey').value = key || '';
            document.getElementById('modalTitle').innerHTML = key ? '<i class="bi bi-pencil-square me-2"></i>Редактировать достижение' : '<i class="bi bi-plus-circle me-2"></i>Новое достижение';
            
            document.getElementById('key').value = ach?.achievement_key || '';
            document.getElementById('key').disabled = !!key;
            document.getElementById('icon').value = ach?.icon || '🏅';
            document.getElementById('name_ru').value = ach?.name_ru || '';
            document.getElementById('name_en').value = ach?.name_en || '';
            document.getElementById('name_es').value = ach?.name_es || '';
            document.getElementById('name_zh').value = ach?.name_zh || '';
            document.getElementById('desc_ru').value = ach?.description_ru || '';
            document.getElementById('desc_en').value = ach?.description_en || '';
            document.getElementById('desc_es').value = ach?.description_es || '';
            document.getElementById('desc_zh').value = ach?.description_zh || '';
            document.getElementById('reward').value = ach?.reward_points || 0;
            document.getElementById('category').value = ach?.category || 'fumble';
            document.getElementById('is_active').checked = ach?.is_active ?? true;
            
            achievementModal.show();
        }

        async function saveAchievement() {
            const key = document.getElementById('achievementKey').value;
            const data = {
                achievement_key: document.getElementById('key').value,
                icon: document.getElementById('icon').value,
                name_ru: document.getElementById('name_ru').value,
                name_en: document.getElementById('name_en').value,
                name_es: document.getElementById('name_es').value,
                name_zh: document.getElementById('name_zh').value,
                description_ru: document.getElementById('desc_ru').value,
                description_en: document.getElementById('desc_en').value,
                description_es: document.getElementById('desc_es').value,
                description_zh: document.getElementById('desc_zh').value,
                reward_points: parseInt(document.getElementById('reward').value),
                category: document.getElementById('category').value,
                is_active: document.getElementById('is_active').checked
            };
            
            const url = key ? `/api/achievements-list/${key}` : '/api/achievements-list';
            const method = key ? 'PUT' : 'POST';
            
            await fetch(url, {
                method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            achievementModal.hide();
            loadAchievements();
        }

        async function deleteAchievement(key) {
            if (!confirm('Удалить достижение?')) return;
            await fetch(`/api/achievements-list/${key}`, {method: 'DELETE'});
            loadAchievements();
        }
    </script>
</body>
</html>
