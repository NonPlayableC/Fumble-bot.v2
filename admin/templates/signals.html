<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сигналы — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="bi bi-robot"></i> BINTY Admin</span>
            <div class="d-flex align-items-center">
                <span class="text-white-50 me-3" id="currentTime"></span>
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                        <li class="nav-item"><a class="nav-link" href="/users"><i class="bi bi-people"></i> Пользователи</a></li>
                        <li class="nav-item"><a class="nav-link" href="/memes"><i class="bi bi-emoji-laughing"></i> Мемы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/stickers"><i class="bi bi-sticky"></i> Стикеры</a></li>
                        <li class="nav-item"><a class="nav-link" href="/quests"><i class="bi bi-list-check"></i> Квесты</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/signals"><i class="bi bi-broadcast"></i> Сигналы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/fumble"><i class="bi bi-dice-5"></i> Вопросы фамбла</a></li>
                        <li class="nav-item"><a class="nav-link" href="/achievements"><i class="bi bi-trophy"></i> Достижения</a></li>
                        <li class="nav-item"><a class="nav-link" href="/subscribers"><i class="bi bi-envelope"></i> Подписчики</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-exclamation-triangle"></i> Логи ошибок</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="page-title"><i class="bi bi-broadcast me-2"></i>Управление сигналами</h2>
                    <button class="btn btn-success" onclick="openModal(null)"><i class="bi bi-plus-lg"></i> Новый сигнал</button>
                </div>

                <div class="card fade-in">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Текст (RU)</th>
                                        <th>Тип</th>
                                        <th>Статус</th>
                                        <th>Действия</th>
                                    </tr>
                                </thead>
                                <tbody id="signalsTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal fade" id="signalModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"><i class="bi bi-plus-circle me-2"></i>Новый сигнал</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="signalId">
                    
                    <ul class="nav nav-tabs mb-3">
                        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#tab-ru">RU</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-en">EN</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-es">ES</a></li>
                        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#tab-zh">ZH</a></li>
                    </ul>
                    
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="tab-ru">
                            <textarea id="text_ru" class="form-control" rows="3" placeholder="Текст сигнала на русском"></textarea>
                        </div>
                        <div class="tab-pane fade" id="tab-en">
                            <textarea id="text_en" class="form-control" rows="3" placeholder="Текст сигнала на английском"></textarea>
                        </div>
                        <div class="tab-pane fade" id="tab-es">
                            <textarea id="text_es" class="form-control" rows="3" placeholder="Текст сигнала на испанском"></textarea>
                        </div>
                        <div class="tab-pane fade" id="tab-zh">
                            <textarea id="text_zh" class="form-control" rows="3" placeholder="Текст сигнала на китайском"></textarea>
                        </div>
                    </div>
                    
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <label class="form-label">Тип сигнала</label>
                            <select id="signal_type" class="form-select">
                                <option value="normal">Обычный</option>
                                <option value="rare">Редкий</option>
                                <option value="daily">Дневной</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-check mt-3">
                        <input type="checkbox" id="is_active" class="form-check-input" checked>
                        <label class="form-check-label">Активен</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="saveSignal()"><i class="bi bi-check-lg"></i> Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let signalModal;
        let signals = [];

        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('ru-RU');
        }
        updateTime();
        setInterval(updateTime, 1000);

        document.addEventListener('DOMContentLoaded', () => {
            signalModal = new bootstrap.Modal(document.getElementById('signalModal'));
            loadSignals();
        });

        async function loadSignals() {
            const res = await fetch('/api/signals');
            signals = await res.json();
            
            const tbody = document.getElementById('signalsTable');
            if (signals.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Нет сигналов</td></tr>';
                return;
            }
            
            tbody.innerHTML = signals.map(s => `
                <tr>
                    <td>${s.id}</td>
                    <td>${(s.text_ru || '').substring(0, 50)}…</td>
                    <td><span class="badge bg-info">${s.signal_type || 'normal'}</span></td>
                    <td>${s.is_active ? '<span class="badge badge-success">Активен</span>' : '<span class="badge badge-danger">Выкл</span>'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openModal(${s.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteSignal(${s.id})"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(id) {
            const signal = id ? signals.find(s => s.id === id) : null;
            document.getElementById('signalId').value = id || '';
            document.getElementById('modalTitle').innerHTML = id ? '<i class="bi bi-pencil-square me-2"></i>Редактировать сигнал' : '<i class="bi bi-plus-circle me-2"></i>Новый сигнал';
            
            document.getElementById('text_ru').value = signal?.text_ru || '';
            document.getElementById('text_en').value = signal?.text_en || '';
            document.getElementById('text_es').value = signal?.text_es || '';
            document.getElementById('text_zh').value = signal?.text_zh || '';
            document.getElementById('signal_type').value = signal?.signal_type || 'normal';
            document.getElementById('is_active').checked = signal?.is_active ?? true;
            
            signalModal.show();
        }

        async function saveSignal() {
            const id = document.getElementById('signalId').value;
            const data = {
                text_ru: document.getElementById('text_ru').value,
                text_en: document.getElementById('text_en').value,
                text_es: document.getElementById('text_es').value,
                text_zh: document.getElementById('text_zh').value,
                signal_type: document.getElementById('signal_type').value,
                is_active: document.getElementById('is_active').checked
            };
            
            const url = id ? `/api/signals/${id}` : '/api/signals';
            const method = id ? 'PUT' : 'POST';
            
            await fetch(url, {
                method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            signalModal.hide();
            loadSignals();
        }

        async function deleteSignal(id) {
            if (!confirm('Удалить сигнал?')) return;
            await fetch(`/api/signals/${id}`, {method: 'DELETE'});
            loadSignals();
        }
    </script>
</body>
</html>
