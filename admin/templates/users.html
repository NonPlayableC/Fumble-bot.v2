<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи — BINTY Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand"><i class="bi bi-robot"></i> BINTY Admin</span>
            <div class="d-flex align-items-center">
                <span class="text-white-50 me-3" id="currentTime"></span>
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Дашборд</a></li>
                        <li class="nav-item"><a class="nav-link active" href="/users"><i class="bi bi-people"></i> Пользователи</a></li>
                        <li class="nav-item"><a class="nav-link" href="/memes"><i class="bi bi-emoji-laughing"></i> Мемы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/stickers"><i class="bi bi-sticky"></i> Стикеры</a></li>
                        <li class="nav-item"><a class="nav-link" href="/quests"><i class="bi bi-list-check"></i> Квесты</a></li>
                        <li class="nav-item"><a class="nav-link" href="/signals"><i class="bi bi-broadcast"></i> Сигналы</a></li>
                        <li class="nav-item"><a class="nav-link" href="/fumble"><i class="bi bi-dice-5"></i> Вопросы фамбла</a></li>
                        <li class="nav-item"><a class="nav-link" href="/achievements"><i class="bi bi-trophy"></i> Достижения</a></li>
                        <li class="nav-item"><a class="nav-link" href="/subscribers"><i class="bi bi-envelope"></i> Подписчики</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-exclamation-triangle"></i> Логи ошибок</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="page-title"><i class="bi bi-people me-2"></i>Пользователи</h2>
                    <div class="search-box" style="width: 300px;">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" class="form-control" placeholder="Поиск по имени, username или ID...">
                    </div>
                </div>

                <div class="card fade-in">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Username</th>
                                        <th>Имя</th>
                                        <th>Язык</th>
                                        <th>Фамблы</th>
                                        <th>Очки</th>
                                        <th>Стрик</th>
                                        <th>Статус</th>
                                        <th>Действия</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody">
                                    <tr><td colspan="9" class="text-center py-4">Загрузка...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <div id="userCountInfo" class="text-muted"></div>
                        <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div class="modal fade" id="editUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Редактировать пользователя</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editUserId">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-dice-5 me-1"></i>Очки фамбла</label>
                        <input type="number" id="editScore" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-coin me-1"></i>Баланс $BINTY</label>
                        <input type="number" id="editBalance" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-fire me-1"></i>Стрик (дней)</label>
                        <input type="number" id="editStreak" class="form-control">
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" id="editBlocked" class="form-check-input">
                        <label class="form-check-label text-danger"><i class="bi bi-shield-slash me-1"></i>Заблокирован</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" onclick="saveUser()"><i class="bi bi-check-lg"></i> Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let editModal;
        let currentPage = 1;
        let totalPages = 1;
        let currentSearch = '';

        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('ru-RU');
        }
        updateTime();
        setInterval(updateTime, 1000);

        document.addEventListener('DOMContentLoaded', () => {
            editModal = new bootstrap.Modal(document.getElementById('editUserModal'));
            loadUsers();
            
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentSearch = e.target.value;
                    currentPage = 1;
                    loadUsers();
                }, 300);
            });
        });

        async function loadUsers() {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></td></tr>';
            
            const url = currentSearch 
                ? `/api/users/search?q=${encodeURIComponent(currentSearch)}`
                : `/api/users?page=${currentPage}`;
            
            const res = await fetch(url);
            
            if (currentSearch) {
                const users = await res.json();
                renderUsers(users);
                document.getElementById('userCountInfo').textContent = `Найдено: ${users.length}`;
                document.getElementById('pagination').innerHTML = '';
            } else {
                const data = await res.json();
                renderUsers(data.users);
                document.getElementById('userCountInfo').textContent = `Всего: ${data.total} | Страница ${data.page} из ${Math.ceil(data.total / data.per_page)}`;
                renderPagination(data.total, data.page, data.per_page);
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted"><i class="bi bi-emoji-frown me-2"></i>Ничего не найдено</td></tr>';
                return;
            }
            
            tbody.innerHTML = users.map(u => {
                const stats = u.user_stats || {};
                return `<tr>
                    <td><code>${u.user_id}</code></td>
                    <td><strong>@${u.username || '-'}</strong></td>
                    <td>${u.first_name || '-'}</td>
                    <td><span class="badge badge-info">${u.language || 'en'}</span></td>
                    <td><span class="badge bg-secondary">${stats.total_fumbles || 0}</span></td>
                    <td><span class="badge bg-warning text-dark">${stats.total_score || 0}</span></td>
                    <td>${u.streak_days ? '🔥 '.repeat(Math.min(u.streak_days, 5)) : '—'}</td>
                    <td>${u.blocked ? '<span class="badge badge-danger">Заблокирован</span>' : '<span class="badge badge-success">Активен</span>'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick='editUser(${JSON.stringify(u).replace(/'/g, "&apos;")})'><i class="bi bi-pencil"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        function renderPagination(total, page, perPage) {
            totalPages = Math.ceil(total / perPage);
            const pagination = document.getElementById('pagination');
            let html = '';
            
            html += `<li class="page-item ${page === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${page - 1}); return false;"><i class="bi bi-chevron-left"></i></a></li>`;
            
            for (let i = Math.max(1, page - 2); i <= Math.min(totalPages, page + 2); i++) {
                html += `<li class="page-item ${i === page ? 'active' : ''}"><a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a></li>`;
            }
            
            html += `<li class="page-item ${page === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${page + 1}); return false;"><i class="bi bi-chevron-right"></i></a></li>`;
            
            pagination.innerHTML = html;
        }

        function changePage(page) {
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                loadUsers();
            }
        }

        function editUser(user) {
            document.getElementById('editUserId').value = user.user_id;
            document.getElementById('editScore').value = user.user_stats?.total_score || 0;
            document.getElementById('editBalance').value = user.user_balances?.amount || 0;
            document.getElementById('editStreak').value = user.streak_days || 0;
            document.getElementById('editBlocked').checked = user.blocked || false;
            editModal.show();
        }

        async function saveUser() {
            const userId = document.getElementById('editUserId').value;
            const data = {
                total_score: parseInt(document.getElementById('editScore').value) || 0,
                balance: parseInt(document.getElementById('editBalance').value) || 0,
                streak_days: parseInt(document.getElementById('editStreak').value) || 0,
                blocked: document.getElementById('editBlocked').checked
            };
            
            const btn = document.querySelector('.modal-footer .btn-primary');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Сохранение...';
            btn.disabled = true;
            
            await fetch(`/api/users/${userId}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            editModal.hide();
            btn.innerHTML = '<i class="bi bi-check-lg"></i> Сохранить';
            btn.disabled = false;
            loadUsers();
        }
    </script>
</body>
</html>
